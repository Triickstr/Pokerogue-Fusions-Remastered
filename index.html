<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Moved to pokemania.io</title>

    <!--
      This calculator has moved to https://pokemania.io.

      GitHub Pages is a static host and cannot send a real 301, so the redirect
      is a meta refresh plus a script, with a visible link if both are blocked.
      The canonical link is what tells search engines the new address owns this
      content.

      The rest of this repository is left as it was. Nothing on pokemania.io
      depends on it — unlike the Team-Planner repo, whose images/ directory
      still serves the new site's sprites — but the old calculator is kept
      rather than deleted so its history stays readable. Only this page
      changed.
    -->
    <link rel="canonical" href="https://pokemania.io/fusions" />
    <meta http-equiv="refresh" content="0; url=https://pokemania.io/fusions" />

    <style>
      :root { color-scheme: dark; }
      body {
        margin: 0;
        min-height: 100vh;
        display: flex;
        align-items: center;
        justify-content: center;
        background: #0e0f13;
        color: #e8eaf0;
        font-family: ui-sans-serif, system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
        text-align: center;
        padding: 24px;
      }
      .brand { color: #f2a33c; font-size: 13px; letter-spacing: 1px; text-transform: uppercase; }
      h1 { margin: 10px 0 6px; font-size: 26px; font-weight: 600; }
      p { margin: 0 0 22px; color: #9aa1b4; font-size: 15px; line-height: 1.5; }
      a.go {
        display: inline-block;
        background: #f2a33c;
        color: #16181f;
        text-decoration: none;
        font-weight: 600;
        font-size: 15px;
        padding: 10px 20px;
        border-radius: 10px;
      }
      a.go:hover { background: #ffb659; }
    </style>
  </head>
  <body>
    <main>
      <div class="brand">PokeRogue SideKick</div>
      <h1>The fusion calculator has moved</h1>
      <p>
        It now lives at <strong>pokemania.io</strong>, alongside the team
        builder, with defensive coverage that accounts for the active ability.
      </p>
      <a class="go" href="https://pokemania.io/fusions">Go to the new calculator</a>
    </main>

    <script>
      // replace() rather than assigning href: it keeps this page out of the
      // history stack, so Back returns where the visitor came from instead of
      // landing here and bouncing them forward again.
      location.replace('https://pokemania.io/fusions');
    </script>
  </body>
</html>
